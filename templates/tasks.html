<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Список задач</title>
</head>
<body>
  <h1>Список задач</h1>
  <ul>
  {% for task in tasks %}
    <li>{{ task.title }}{% if task.completed %} (выполнено){% endif %}</li>
  {% else %}
    <li>Задач пока нет</li>
  {% endfor %}
  </ul>
</body>
</html>
